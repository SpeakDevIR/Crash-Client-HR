<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جهت دانلود کلیک کنید</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0a0a18;
  --bg2:#1a0b2e;
  --accent1:#8b5cf6;
  --accent2:#ec4899;
  --accent3:#06ffa5;
}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg1);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  color:white;
}
.bg-wrapper{
  position:fixed;
  inset:0;
  z-index:0;
  background:radial-gradient(ellipse at top left, #1e1b4b 0%, transparent 50%),
              radial-gradient(ellipse at bottom right, #4c0519 0%, transparent 50%),
              radial-gradient(ellipse at center, #0f172a 0%, var(--bg1) 100%);
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:0.6;
  mix-blend-mode:screen;
  animation:blobMove 20s infinite alternate ease-in-out;
}
.blob1{width:600px;height:600px;background:radial-gradient(circle, rgba(139,92,246,0.8), rgba(139,92,246,0));top:-150px;right:-100px;}
.blob2{width:500px;height:500px;background:radial-gradient(circle, rgba(236,72,153,0.7), rgba(236,72,153,0));bottom:-150px;left:-100px;animation-delay:-5s;}
.blob3{width:700px;height:700px;background:radial-gradient(circle, rgba(6,255,165,0.15), transparent 70%);top:20%;left:30%;animation-delay:-10s;}
@keyframes blobMove{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  33%{transform:translate(80px,-80px) scale(1.1) rotate(5deg)}
  66%{transform:translate(-60px,60px) scale(0.9) rotate(-5deg)}
  100%{transform:translate(40px,40px) scale(1.05) rotate(3deg)}
}
#particleCanvas{position:fixed;inset:0;z-index:1;pointer-events:none;}
.cursor-glow{
  position:fixed;
  width:400px;height:400px;
  background:radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
  border-radius:50%;pointer-events:none;z-index:2;
  transform:translate(-50%,-50%);transition:transform 0.15s ease-out;mix-blend-mode:screen;
}
.container{position:relative;z-index:10;width:100%;max-width:480px;padding:20px;}
.card{
  background:linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:32px;
  padding:48px 36px 36px;
  box-shadow:0 0 0 1px rgba(255,255,255,0.05) inset,0 20px 80px rgba(0,0,0,0.5),0 0 120px rgba(139,92,246,0.15);
  text-align:center;
  animation:cardEntrance 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
  position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);}
.card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg, transparent, rgba(139,92,246,0.1), transparent, rgba(236,72,153,0.1), transparent);animation:rotateConic 8s linear infinite;pointer-events:none;opacity:0.5;}
@keyframes rotateConic{to{transform:rotate(360deg)}}
@keyframes cardEntrance{from{opacity:0;transform:translateY(40px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.card-content{position:relative;z-index:2;}
.icon-box{width:96px;height:96px;margin:0 auto 28px;position:relative;}
.icon-glow{position:absolute;inset:-10px;background:radial-gradient(circle, rgba(139,92,246,0.4), transparent 70%);border-radius:50%;filter:blur(12px);animation:pulseGlow 3s infinite ease-in-out;}
.icon-main{position:relative;width:100%;height:100%;background:linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));border:1px solid rgba(255,255,255,0.2);border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(139,92,246,0.3);animation:iconFloat 4s infinite ease-in-out;}
.icon-main svg{width:44px;height:44px;filter:drop-shadow(0 0 10px rgba(139,92,246,0.8));}
@keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.15);opacity:1}}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(6,255,165,0.1);border:1px solid rgba(6,255,165,0.2);color:#06ffa5;font-size:12px;font-weight:700;padding:6px 14px;border-radius:100px;margin-bottom:20px;animation:fadeUp 0.8s 0.2s both;}
.badge-dot{width:6px;height:6px;background:#06ffa5;border-radius:50%;box-shadow:0 0 8px #06ffa5;animation:dotBlink 1.5s infinite;}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:0.4}}
h1{font-size:28px;font-weight:900;line-height:1.3;margin-bottom:12px;background:linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.6) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:fadeUp 0.8s 0.3s both;}
.subtitle{color:rgba(255,255,255,0.55);font-size:15px;font-weight:300;line-height:1.8;margin-bottom:36px;animation:fadeUp 0.8s 0.4s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.file-info{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 18px;margin-bottom:28px;animation:fadeUp 0.8s 0.5s both;}
.file-left{display:flex;align-items:center;gap:12px;}
.file-type{width:36px;height:36px;background:linear-gradient(135deg, #8b5cf6, #ec4899);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;}
.file-details{text-align:right;}
.file-name{font-size:13px;font-weight:700;color:rgba(255,255,255,0.9);}
.file-size{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;}
.file-check{width:28px;height:28px;background:rgba(6,255,165,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#06ffa5;}
.download-btn{
  position:relative;width:100%;height:64px;
  background:linear-gradient(135deg, #8b5cf6 0%, #7c3aed 25%, #ec4899 100%);
  border:none;border-radius:18px;color:white;
  font-family:'Vazirmatn',sans-serif;font-size:18px;font-weight:800;
  cursor:pointer;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,0.2) inset,0 10px 30px rgba(139,92,246,0.4),0 0 60px rgba(236,72,153,0.25);
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);animation:fadeUp 0.8s 0.6s both;isolation:isolate;
}
.download-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg, #a78bfa, #f472b6);opacity:0;transition:opacity 0.4s;z-index:-1;}
.download-btn:hover::before{opacity:1;}
.download-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);transform:skewX(-20deg);animation:shineMove 3s infinite;}
@keyframes shineMove{0%{left:-100%}50%,100%{left:150%}}
.download-btn:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 0 0 1px rgba(255,255,255,0.3) inset,0 15px 40px rgba(139,92,246,0.5),0 0 80px rgba(236,72,153,0.35);}
.download-btn:active{transform:translateY(0) scale(0.99);}
.btn-content{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;z-index:2;transition:all 0.3s;}
.btn-icon-circle{width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);}
.download-btn:hover .btn-icon-circle{transform:translateX(-4px) rotate(-10deg);}
.btn-text{letter-spacing:0.3px;text-shadow:0 1px 2px rgba(0,0,0,0.2);}
.download-btn.loading .btn-content{opacity:0;transform:translateY(-10px);}
.progress-track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.download-btn.loading .progress-track{opacity:1;}
.progress-bar{position:absolute;bottom:0;right:0;height:4px;background:white;border-radius:0 0 18px 18px;width:0%;transition:width 0.1s linear;box-shadow:0 0 10px white;}
.progress-text{font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;}
.spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.success-check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg, #10b981, #06ffa5);opacity:0;pointer-events:none;transform:scale(0.9);transition:all 0.5s cubic-bezier(0.16,1,0.3,1);border-radius:18px;}
.download-btn.success .success-check{opacity:1;transform:scale(1);pointer-events:auto;}
.download-btn.success .btn-content,.download-btn.success .progress-track{opacity:0;}
.hint{margin-top:20px;font-size:12px;color:rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;gap:6px;animation:fadeUp 0.8s 0.7s both;}
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:100;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:white;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,0.5);z-index:200;opacity:0;transition:all 0.6s cubic-bezier(0.16,1,0.3,1);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast-dot{width:8px;height:8px;background:#06ffa5;border-radius:50%;box-shadow:0 0 10px #06ffa5;}
.noise{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");}

.config-tag{
  position:fixed; top:18px; left:18px;
  background:rgba(0,0,0,0.5); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.5);
  font-size:11px; padding:8px 12px; border-radius:8px;
  z-index:50; font-family:monospace; direction:ltr;
}
</style>
</head>
<body>
<div class="bg-wrapper"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div></div>
<div class="noise"></div>
<canvas id="particleCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="container">
  <div class="card" id="card">
    <div class="card-content">
      <div class="icon-box">
        <div class="icon-glow"></div>
        <div class="icon-main">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
      </div>
      <div class="badge"><span class="badge-dot"></span> لینک دانلود فعال است</div>
      <h1>آماده دانلوده! 🚀</h1>
      <p class="subtitle">فایل شما با موفقیت پردازش شد و آماده دریافت است.<br>با یک کلیک ساده دانلود را شروع کنید.</p>

      <div class="file-info">
        <div class="file-left">
          <div class="file-type" id="fileType">ZIP</div>
          <div class="file-details">
            <div class="file-name" id="fileNameDisplay">HR-Client.jar</div>
            <div class="file-size">امن و تست شده • دانلود مستقیم</div>
          </div>
        </div>
        <div class="file-check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <button class="download-btn" id="downloadBtn">
        <div class="btn-content">
          <span class="btn-text">جهت دانلود کلیک کنید</span>
          <span class="btn-icon-circle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
        </div>
        <div class="progress-track">
          <div class="progress-text"><div class="spinner"></div><span id="progressPercent">۰٪</span></div>
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="success-check">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span>دانلود با موفقیت انجام شد!</span>
        </div>
      </button>

      <div class="hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        دانلود امن و رمزگذاری شده • بدون تبلیغات
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast-dot"></span><span>دانلود شما آغاز شد...</span></div>

<script>
// ==================================================================
// ⚙️⚙️⚙️ فقط این قسمت رو ویرایش کن - بقیه رو دست نزن ⚙️⚙️⚙️
// ==================================================================
const CONFIG = {
  // 👇👇👇 لینک مستقیم دانلودت رو اینجا بذار 👇👇👇
  // مثال: "https://example.com/files/my-video.zip"
  // مثال گوگل درایو: "https://drive.google.com/uc?export=download&id=FILE_ID"
  downloadUrl: "https://github.com/SpeakDevIR/Crash-Client-HR/releases/download/Fixed1.0.0/HR-Client.jar", 

  // اسم فایلی که میخوای موقع ذخیره نشون داده بشه
  fileName: "HR-Client.jar",

  // اگه لینکت گوگل درایو، تلگرام، مگا، مدیافایر هست این رو true کن
  // اگه لینک مستقیم از هاست خودته false بمونه
  openInNewTab: false,

  // متن دکمه (اگه خواستی عوض کنی)
  buttonText: "جهت دانلود کلیک کنید"
};
// ==================================================================
// پایان تنظیمات
// ==================================================================

const glow = document.getElementById('cursorGlow');
document.addEventListener('mousemove', e=>{
  glow.style.left = e.clientX+'px';
  glow.style.top = e.clientY+'px';
});

// نمایش تنظیمات فعلی
const configTag = document.getElementById('configTag');
const fileNameDisplay = document.getElementById('fileNameDisplay');
const fileTypeEl = document.getElementById('fileType');
if(CONFIG.downloadUrl){
  configTag.textContent = `✓ Connected to: ${CONFIG.downloadUrl.substring(0,45)}...`;
  configTag.style.color = '#06ffa5';
  configTag.style.borderColor = 'rgba(6,255,165,0.3)';
  fileNameDisplay.textContent = CONFIG.fileName;
  let ext = CONFIG.fileName.split('.').pop().toUpperCase().substring(0,4);
  fileTypeEl.textContent = ext || 'FILE';
} else {
  fileNameDisplay.textContent = "HR-Client.jar";
}
if(CONFIG.buttonText){
  document.querySelector('.btn-text').textContent = CONFIG.buttonText;
}

// Particles
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeP(){ pCanvas.width = innerWidth; pCanvas.height = innerHeight; }
resizeP(); addEventListener('resize', resizeP);
for(let i=0;i<60;i++) particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+0.3,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,opacity:Math.random()*0.5+0.1});
(function animateParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>pCanvas.width) p.vx*=-1;
    if(p.y<0||p.y>pCanvas.height) p.vy*=-1;
    pCtx.beginPath(); pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pCtx.fillStyle=`rgba(255,255,255,${p.opacity})`; pCtx.fill();
    particles.forEach(p2=>{
      let dx=p.x-p2.x, dy=p.y-p2.y, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){
        pCtx.beginPath(); pCtx.moveTo(p.x,p.y); pCtx.lineTo(p2.x,p2.y);
        pCtx.strokeStyle=`rgba(139,92,246,${0.08*(1-dist/120)})`; pCtx.stroke();
      }
    });
  });
  requestAnimationFrame(animateParticles);
})();

const card = document.getElementById('card');
card.addEventListener('mousemove', e=>{
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width/2;
  const y = e.clientY - rect.top - rect.height/2;
  card.style.transform=`perspective(1000px) rotateX(${y/-20}deg) rotateY(${x/20}deg) translateZ(10px)`;
});
card.addEventListener('mouseleave', ()=>{ card.style.transform=`perspective(1000px) rotateX(0) rotateY(0) translateZ(0)`; });

const btn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressPercent = document.getElementById('progressPercent');
const toast = document.getElementById('toast');
const confettiCanvas = document.getElementById('confettiCanvas');
const cCtx = confettiCanvas.getContext('2d');
function resizeC(){ confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight; }
resizeC(); addEventListener('resize',resizeC);

function triggerConfetti(){
  let confettis=[]; const colors=['#8b5cf6','#ec4899','#06ffa5','#ffffff','#a78bfa'];
  for(let i=0;i<150;i++) confettis.push({x:innerWidth/2+(Math.random()-0.5)*200,y:innerHeight/2,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.7)*12,r:Math.random()*6+3,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vr:(Math.random()-0.5)*10,opacity:1});
  let frame=0;
  (function anim(){
    cCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    confettis.forEach(c=>{
      c.x+=c.vx; c.y+=c.vy; c.vy+=0.25; c.vx*=0.99; c.rot+=c.vr; c.opacity-=0.008;
      cCtx.save(); cCtx.translate(c.x,c.y); cCtx.rotate(c.rot*Math.PI/180);
      cCtx.globalAlpha=Math.max(0,c.opacity); cCtx.fillStyle=c.color;
      cCtx.fillRect(-c.r/2,-c.r/2,c.r,c.r*1.5); cCtx.restore();
    });
    frame++; if(frame<250) requestAnimationFrame(anim); else cCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  })();
}

function doRealDownload(){
  if(!CONFIG.downloadUrl){
    // حالت دمو
    const blob=new Blob(['سلام! این یک فایل نمونه است.\nلینک خودت رو در CONFIG.downloadUrl بذار تا فایل اصلی دانلود بشه 💜'],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=CONFIG.fileName||'download.txt'; a.click();
    URL.revokeObjectURL(url);
    return;
  }

  // تشخیص لینک غیرمستقیم
  const isIndirect = CONFIG.openInNewTab || /drive\.google|dropbox\.com|t\.me|mega\.nz|mediafire|telegram/.test(CONFIG.downloadUrl);

  if(isIndirect){
    window.open(CONFIG.downloadUrl, '_blank');
  } else {
    // دانلود مستقیم
    const a=document.createElement('a');
    a.href=CONFIG.downloadUrl;
    a.download=CONFIG.fileName || '';
    // بعضی مرورگرها برای لینک خارجی download رو نادیده میگیرن، پس target هم میذاریم
    a.target='_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

btn.addEventListener('click', ()=>{
  if(btn.classList.contains('loading')||btn.classList.contains('success')) return;
  btn.classList.add('loading');
  let progress=0;
  let interval=setInterval(()=>{
    progress+=Math.random()*12+2;
    if(progress>=100){
      progress=100; clearInterval(interval);
      progressBar.style.width='100%';
      progressPercent.textContent='۱۰۰٪';
      setTimeout(()=>{
        btn.classList.remove('loading'); btn.classList.add('success');
        triggerConfetti();
        showToast('فایل با موفقیت دانلود شد! ✅', true);
        doRealDownload();
        setTimeout(()=>{ btn.classList.remove('success'); progressBar.style.width='0%'; },3500);
      },400);
    }
    progressBar.style.width=progress+'%';
    progressPercent.textContent=Math.floor(progress).toLocaleString('fa-IR')+'٪';
  },80);
  showToast('دانلود شما آغاز شد، لطفا منتظر بمانید...');
});

function showToast(msg, isSuccess=false){
  toast.querySelector('span:last-child').textContent=msg;
  toast.classList.add('show');
  if(isSuccess) toast.querySelector('.toast-dot').style.background='#06ffa5';
  setTimeout(()=>{toast.classList.remove('show')},3500);
}
document.body.style.opacity='0';
setTimeout(()=>{document.body.style.transition='opacity 0.8s'; document.body.style.opacity='1'},100);
</script>
</body>
